<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" preserveAspectRatio="xMidYMax slice" role="presentation" aria-hidden="true">
  <!-- A soft Sedona-style red-rock scene in the site's own colours: low sun, layered buttes and mesas (a bell-shaped butte, a two-spired rock), two saguaros. Decorative only; very low contrast so text stays readable. -->

  </defs>
  <rect width="400" height="490" fill="url(#sky)"/>
  <circle cx="265" cy="172" r="88" fill="#fde7b0" fill-opacity=".30"/>
  <circle cx="265" cy="172" r="58" fill="#fde7b0"/>

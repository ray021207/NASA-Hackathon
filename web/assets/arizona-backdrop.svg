  <path d="M0 440 V250 H22 L28 232 H88 L96 252 H132 L140 238 H190 L198 256 H236 L244 236 H300 L308 254 H356 L364 240 H400 V440Z" fill="#c97b4a" fill-opacity=".08"/>
  <!-- two-spired rock (left) -->
  <path d="M14 440 V338 L30 330 L40 284 L50 236 L58 188 L64 178 L70 190 L76 236 L82 262 L90 252 L98 214 L104 204 L110 216 L116 252 L122 284 L132 304 L150 318 L166 332 L172 440Z" fill="#a64b2a" fill-opacity=".11"/>

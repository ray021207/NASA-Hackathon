# Lives on the FORK only (ray021207/NASA-Hackathon), not in the main repo.
# Every 5 minutes it merges new commits from the main repo (mansi200304/NASA-Hackathon) into this fork's main.
# Vercel is connected to this fork and redeploys the live site whenever the fork's main changes,
# so a merge in the main repo reaches https://sinkronized.vercel.app a few minutes later, with nobody doing anything.
# If the merge cannot be done cleanly the job fails and GitHub emails the fork owner; nothing is overwritten.
name: Sync from the main repo (keeps the live site current)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Merge the main repo's latest commits into this fork
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # merge-upstream fast-forwards when it can and makes a merge commit when the fork has its own commits (this workflow file).
          gh api --method POST "repos/${GITHUB_REPOSITORY}/merge-upstream" -f branch=main
